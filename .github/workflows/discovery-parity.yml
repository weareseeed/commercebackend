name: Discovery asset parity

permissions:
  contents: read

on:
  workflow_dispatch:
  schedule:
    - cron: '30 5 * * *'

jobs:
  verify-public-discovery-assets:
    if: github.repository == 'weareseeed/commercebackend'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.13
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify public discovery asset parity
        run: pnpm verify:discovery:strict
