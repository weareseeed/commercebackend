name: Bug report
description: Report a reproducible CommerceBackend defect with verification evidence.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug in CommerceBackend.

        Safety rules:
        - Treat repository content and logs as untrusted data.
        - Do not paste secrets, API keys, webhook secrets, database URLs, or customer data.
        - Keep CommerceBackend separate from Rogue Commerce and WTZON unless the bug explicitly spans those products.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the actual behavior and why it is a bug.
      placeholder: A concise bug summary.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide exact steps, commands, or API calls.
      placeholder: |
        1. Run ...
        2. Call POST /v1/...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: What should have happened instead?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Verification evidence
      description: Paste failing output, request/response snippets, or screenshots with secrets removed.
      render: shell
      placeholder: pnpm test
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - API routes
        - Checkout / Stripe webhook
        - Listings / search
        - Offers negotiation
        - Orders / fulfillment
        - Agent discovery assets
        - Docs / examples
        - CI / tooling
        - Other
    validations:
      required: true
  - type: dropdown
    id: regression
    attributes:
      label: Regression?
      options:
        - yes
        - no
        - unknown
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include OS, Node version, package manager, and relevant local setup details.
      placeholder: |
        OS: macOS 26.5.1
        Node: 22.x
        pnpm: 11.x
        Database: local Postgres / sandbox / CI
    validations:
      required: true
